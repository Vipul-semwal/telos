services:
  postgres:
    image: postgres:16-alpine
    container_name: telos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telos_password}
      POSTGRES_DB: ${POSTGRES_DB:-telos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telos_user} -d ${POSTGRES_DB:-telos}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: telos_postgres_data
